[supervisor]

# Time to terminate execution (seconds since start). Use <= 0 to disable. Default: 0
exit_time = 0

# Headless deterministic gait run. A positive value follows the same state
# machine as S, then T, then D: stand, own MdlTrot for this many seconds
# (including its WAIT/PREP), stop and sit, then exit. Zero keeps the interactive
# supervisor. Useful for reproducible horizon comparisons without pty timing.
autorun_trot_duration = 0

log = {
  # Enable/disable automatic local logging
  enable = false

  # Start logging at this time
  start = 3,

  # Log every nth module manager cycle (default: 1)
  period = 10

  # List of variables to log. The estimator entries pair the two stages'
  # output with MdlSimDriver_qpos/qvel ground truth in one time-aligned file,
  # which is what makes the estimate plottable offline.
  #
  # Every name here must resolve, or the logging thread gives up after three
  # attempts and silently records nothing at all. Renaming a log variable in a
  # module means editing this list in the same change.
  #
  # There is also a hard size limit, and hitting it looks exactly like a
  # misspelled name: rtclient::LogTask::addVar refuses a line longer than
  # RHEX_LOG_MAX_MSG/2, which is 1024 bytes, so the whole list must fit in 128
  # doubles. On the Go2 the simulator entries alone are large -- qpos is 19 and
  # qvel is 18 -- so this fills up faster than it looks. The list below comes to
  # the ceiling -- adding even two more doubles is refused, measured -- and the
  # failure mode when it overflows is a "Failed to add <name>" warning on the
  # *last* variable that fit, which reads as a misspelling.
  #
  # Two sets below, and exactly one of them must be uncommented: both come to
  # 125 doubles, so neither has room to absorb the other and swapping the
  # comment markers is the only way to record the other one.
  #
  # (a) Estimator set, for figs/estimation/plot_estimation.py: both stages'
  # output beside MdlSimDriver_qpos/qvel ground truth, time-aligned in one file.
  #
  # Two entries were dropped to make room. MdlSimDriver_qacc: the acceleration
  # the estimator actually consumes is already in MdlOrientationEstimator_state,
  # and the generalized acceleration is of little use offline.
  # MdlPosVelEstimator_cov: pure diagnostics, and its first two entries are held
  # at the horizontal clamp and mean nothing anyway. Add either back with -c if
  # you need it, and drop something else in the same breath. MdlTrot_scales, the
  # entry and exit ramp scales, is the same trade: two doubles, and the only
  # thing in the log that separates a command the robot failed to track from one
  # that was never given. Swap it in when a transition is what is being studied.
  #
  vars=["MdlSimDriver_qpos", "MdlSimDriver_qvel", "MdlSimDriver_ctrl",
        "MdlOrientationEstimator_state", "MdlOrientationEstimator_filter",
        "MdlPosVelEstimator_state", "MdlPosVelEstimator_footholds",
        "MdlPosVelEstimator_error",
        "MdlPosVelEstimator_contacts", "MdlPosVelEstimator_footerr",
        "MdlPosVelEstimator_foottruth"],
  #
  # (b) MPC/trot set, for figs/mpc/plot_mpc.py: the commanded signals that
  # script compares against ground truth -- torquereq against MdlSimDriver_ctrl,
  # bodyref against qvel/qpos, footref against foottruth, plus MdlTrot_contact
  # for the swing shading. MdlTrot_footref is 36 doubles by itself, which is
  # what displaces the estimator entries. Recording set (a) instead does not
  # break that script: it still writes every figure, but from the measured
  # traces alone, with nothing commanded to compare them against.
  # vars=["MdlSimDriver_qpos", "MdlSimDriver_qvel", "MdlSimDriver_ctrl",
  #       "MdlTrot_torquereq", "MdlTrot_footref", "MdlTrot_contact",
  #       "MdlTrot_bodyref", "MdlPosVelEstimator_foottruth"],
  #
  # "ascii", "raw" or "matlab"
  file_format = "matlab",
  file_name   = "deneme.mat"
}

# Stand pose delta from activation (meters)
stand_height = 0.25
