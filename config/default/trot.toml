# --- trot.toml ---
# MdlTrot diagonal-trot configuration; stance forces are supplied by MdlConvexMPC.

[trot]

# ---- COMMANDED BODY TWIST
#
# Commanded body-frame twist is integrated into the MPC body reference for tracking.

forward_velocity = 0.70   # v_x [m/s], positive is forward
lateral_velocity = 0.0    # v_y [m/s], positive is left
yaw_rate         = 0.0    # [rad/s], positive turns left

# Low-pass estimated body velocity before touchdown placement and stance-foot sweep.
velocity_filter_tau = 0.1   # [s]

# Fraction of filtered velocity-estimation residual added to the commanded stance sweep; zero uses only the command and one uses the estimate.
stance_velocity_feedback = 0.25

# Horizontal touchdown correction is raibert_gain * (measured velocity - commanded velocity).
raibert_gain = 0.03

# Enable the centrifugal touchdown correction, which contributes only while turning.
centrifugal_term = true

# ---- GAIT

# Duration of one gait cycle; each leg is planted for duty times this period.
period = 0.3              # [s]

# Stance fraction; values above 0.5 overlap diagonal support phases, values below 0.5 leave a flight phase of (0.5 - duty) * period with no foot scheduled down. Swing time is (1 - duty) * period, so a high duty at a short period asks for a fast swing: at 0.3 s and duty 0.8 it is 60 ms and the whole-body path's torque requests exceed the limits on 23-28 % of ticks (check runs, 2026-11-27).
duty = 0.5

# Peak foot clearance at mid-swing.
swing_height = 0.10       # [m]

# Phase offsets are cycles in FL, FR, RL, RR order; [0, 0.5, 0.5, 0] produces diagonal trot.
phase_offset = [0.0, 0.5, 0.5, 0.0]

# ---- NOMINAL FOOTPRINT
#
# Nominal foot position is [x, y, z] relative to each hip, with y mirrored for right legs; z sets the standing height used by the MPC.
origin = [0.0, 0.10, -0.28]

# ---- BLEND DURATIONS
#
# WAIT holds the activation pose, PREP blends to the nominal footprint, TROT uses torque control, and CENTERING returns to the footprint through IK and joint PD.

wait_duration      = 0.3   # [s]
prep_duration      = 1.5   # [s]
centering_duration = 1.5   # [s]

# ---- ENTRY AND EXIT RAMPS
#
# Ramp the commanded twist at TROT entry and exit while stance-foot motion continues to use estimated body velocity.
rampup_duration    = 2.0   # [s]

# Rampdown returns the commanded twist and swing clearance to the nominal footprint before CENTERING.
rampdown_duration  = 1.0   # [s]

# ---- POSE-HOLDING GAINS
#
# Joint-space gains [Nm/rad] and [Nm/(rad/s)] for WAIT, PREP, and CENTERING.
prep_kp = 150.0
prep_kd = 4.0

# ---- SWING GAINS
#
# Cartesian fallback gains [N/m] and [N/(m/s)] for models without leg inertial parameters.
swing_kp_cartesian = 800.0
swing_kd_cartesian = 8.0

# Go2 uses configuration-dependent apparent-mass operational-space gains when inverse dynamics is enabled.
swing_inverse_dynamics = true
swing_natural_frequency = [50.0, 50.0, 50.0]  # omega_x,y,z [rad/s]
swing_damping_ratio = [0.8, 0.8, 0.8]

# Scale the leg acceleration/Coriolis/gravity feedforward term from zero to full inverse dynamics; zero leaves apparent-mass feedback only.
swing_feedforward_scale = 0.0

# Joint-space damping [Nm/(rad/s)] carried with each TROT command; keep it positive because MdlSimDriver replaces non-positive values.
joint_damping = 0.2

# ---- BODY REFERENCE
#
# Clamp the integrated desired horizontal position to this distance from the estimated position.
position_reference_clamp = 0.1   # [m]

# ---- SAFETY

# Maximum joint tracking error [rad] checked during PREP and CENTERING before aborting.
tracking_error_limit = 0.5   # [rad]

# Consecutive rejected leg commands before abort; a rejected command leaves the previous command latched.
command_failure_limit = 3

# Consecutive failed MPC solves before abort while holding the last valid force; a failed first solve aborts immediately.
mpc_failure_limit = 3


# ---- WHOLE-BODY IMPULSE CONTROL (Kim, Di Carlo, Katz, Bledt, Kim 2019)
#
# Replace the per-leg TROT commands with WBIC: the MPC's first-step forces, the body reference and the swing samples become a task hierarchy (body orientation, base position, each swing foot) and a QP over the floating-base acceleration and the forces; every joint gets that torque plus the joint PD below. Go2 only; a tick without a solution uses the per-leg commands, command_failure_limit of them in a row abort.
wbc = false

# Task stiffness [1/s^2] and damping [1/s]: Kim et al. Table I uses 100 and 10 for every task.
wbc_kp_ori  = 100.0
wbc_kd_ori  = 10.0
wbc_kp_pos  = 100.0
wbc_kd_pos  = 10.0
wbc_kp_foot = 100.0
wbc_kd_foot = 10.0

# QP weights on the floating-base acceleration correction and the force correction. Kim's locomotion setting: the base gives way (0.1) so the MPC forces are kept (1); weighting the base 1000 is the balance-stand setting.
wbc_w_base  = 0.1
wbc_w_force = 1.0

# Joint PD [Nm/rad], [Nm/(rad/s)] around the hierarchy's joint references, the same on stance and swing legs as in Kim. 30/3 is the thesis' Go2 stance value (its swing joints get none); Kim uses 3/0.3 on the 9 kg Mini Cheetah. At 30/3 the PD is 10-20x stiffer than the swing task (omega^2 900-2100 against 100 1/s^2 on a lifted Go2 leg), so it sets swing tracking, and on stance legs it holds the body toward its reference outside the QP. kd must stay positive: MdlSimDriver replaces non-positive kd.
wbc_joint_kp = 30.0
wbc_joint_kd = 3.0

# Swing touchdown height [m] below the height the foot lifted off from (body frame). The nominal footprint's z is not used: the stand sags about 10 mm under its joint PD, which put that target 12-15 mm under the ground and landed the closely tracking whole-body swing 21-26 ms early at 1.4 m/s. 3 mm is Kim's value: at 0 the foot arrives 1-2 mm short and in-place pitch rms doubles (0.18 against 0.08 deg). It suits the 0.3 s period; a long swing needs more (period 0.8 s: roll rms 0.30 deg at 3 mm, 0.07 deg at 8 mm; 1.0 s: 1.40 against 0.22 deg). The per-leg path keeps the nominal height.
wbc_touchdown_depth = 0.003

# Attitude integral on the MPC's roll and pitch reference, whole-body path only; 0 turns it off. Nothing else integrates attitude error: the MPC answers a tilt with a moment in proportion (2-3 N m/deg measured), so every steady moment its rigid-body model lacks left a steady tilt (-0.11 deg at 1.0 m/s, -0.88 deg at duty 0.35 and 0.35 m/s). At the end of each gait cycle this share of the cycle's mean tilt is moved into the reference, against the tilt, as Kim's released controller does continuously (rpy_int, rpy_comp in ConvexMPCLocomotion.cpp; theirs is scaled by speed, this one is not because the tilt exists in place too). Once per cycle, on the cycle mean: the tilt the gait repeats every cycle never enters, and the correction slows with the cadence. A continuous integrator at 2 /s held the mean as well at the 0.3 s gait but rocked the body at 0.6 Hz from a 0.7 s period on (roll rms 0.44 deg against 0.05). 0.5 leaves 5 % of an offset after about 8 cycles; 1.0 rocks the body from a 0.5 s period on (2026-11-27).
wbc_attitude_integral_gain = 0.5

# Largest mean tilt [rad] one gait cycle may contribute to the integral. A steady offset is corrected a little more slowly (at most gain * this per cycle); a push, which tilts the body by tens of degrees for about a second, barely moves the reference. Without it a 155 N lateral push ran the reference to its bound within a cycle and the recovery failed, where the trot without the integral recovers up to 160 N (2026-11-27).
wbc_attitude_integral_input = 0.01

# Bound on the reference [rad]. The largest a clean run needed was 0.038 rad (duty 0.35 at 1.0 m/s).
wbc_attitude_integral_limit = 0.05

# ---- SLOW SWINGS
#
# Time [s] a swing takes to rise to swing_height and, at the end, to come down from it (a quintic step each way); in between the foot stays up, and its horizontal motion keeps the whole swing. 0 keeps the default clearance profile, which is what the 0.3 s gait uses. That profile grows with the cube of the swing's progress, so a long swing barely leaves the ground at first: an 8 s swing is 0.7 mm up after 0.4 s. A foot that is scheduled to swing but still on the ground gets loaded as the body starts to tip (46 N for 70 ms measured) and kicks the body about the support line, and the "two-foot phase" then runs on three feet (CoM 71 mm off the line, no fall; 2026-11-27). A gait with long two-foot phases needs the foot clear within tens of milliseconds. Swings no longer than twice this time keep the default profile.
swing_lift_time = 0.0

# ---- ANGULAR-MOMENTUM BALANCING IN THE TWO-FOOT PHASES (thesis Ch. 4-6, TrotAMB)
#
# In every two-foot diagonal phase the AMB law of MdlAMB runs on the current stance pair and swings the two free legs about axes through their hips, parallel to the support line. Needs wbc = true. The law's state is reset at every phase; four-foot and flight phases are idle.
amb = false

# How the law's swing-leg angular acceleration reaches the feet. "offset": integrated into a rotation of the planned foot reference about the hip, which the swing task and the joint PD track (same feedforward, plus feedback on the commanded motion). "passthrough": thesis (6.23), (6.26), the swing task's error is removed along the tangential direction and the acceleration is a pure feedforward there.
amb_mode = "offset"

# Law gains k0 k1 k2 on L, L_dot, L_ddot and the opening-angle PD, as [amb] (the centreline balance).
amb_gains = [950.0, 360.0, 41.0]
amb_kp3 = 100.0
amb_kd3 = 40.0
amb_observer_tc = 0.05

# Cross-bar template. These are [amb]'s values, momentum-matched on the centreline stance at x3 = -304 deg; on the trot's footprint the swing hips sit about 0.15 m from the support line and the legs hang near x3 = -360 deg.
amb_template_m = [14.954, 0.2296, 0.0594]
amb_template_l = [0.30605, 0.31773, 0.56403]
amb_template_d = 0.093

# "passthrough" only, on the share of a swing leg AMB holds, as thesis (6.28) and MdlAMB's whole-body mode: dry joint friction [N m] cancelled in the swing torque (the simulator's 0.2; joint_damping is the viscous part), and the joint PD taken off that leg (true keeps it). Without the cancellation the feedforward accelerations stall in the friction and the legs creep outward until the robot falls, 4.7 s into an 8 s two-foot phase (2026-11-27).
amb_joint_friction = 0.2
amb_swing_joint_pd = false

# Timing within a swing [s]: authority ramps in over amb_ramp after lift-off, and the law stops amb_return before the scheduled touchdown so the feet are back on their planned trajectory when they land. A swing shorter than amb_min_swing leaves AMB off for that phase: the law's dominant time constant is about 0.28 s, and the default gait's 0.15 s swing would be all ramp and return.
amb_ramp = 0.05
amb_return = 0.15
amb_min_swing = 0.4

# CoM centring. The swing legs move the CoM by about 3 mm either way (static hold on the trot's footprint: a two-foot phase started 2.7 mm off the support line is held for 8 s, one started 5.5 mm off is lost), and the trot's footprint has the CoM 9 mm off each diagonal. With this on, the base position task takes its horizontal error from the planted feet instead of the position estimate. Across the support line: while all four feet are down, the CoM's offset from the line of the pair that stays down next, so the body moves until the CoM is over that line; in a two-foot phase, the base's displacement against the stance line since the phase began. Along the line: the base's displacement since the phase began. For a trot in place only: a commanded velocity is not followed in position. Needs a four-foot phase long enough for the base position task to settle (about 0.5 s at wbc_kp_pos 100). A first version integrated a shift into the estimator-based reference: on ground truth it worked, with the position/velocity filter in the loop (1 to 2 cm off at a touchdown) the robot fell after 17 s at 2.0 s two-foot phases (2026-11-27).
amb_centre = false

# Bound on the "offset" rotation [rad] and on the foot acceleration AMB may ask for [m/s^2] (thesis Table 6.2). At 0.6 rad the static hold lost a phase started 2.7 mm off the line that the pass-through, which has no such bound, held with 36 deg of leg travel; at 1.0 rad it held it with 38 deg.
amb_alpha_max = 0.9
amb_foot_acc_max = 50.0
