# --- list.toml ---
#
# Standard include file common to all robots.  Normally located under
# config/default. In addition to loading default include files, it
# also includes additional required configuration files that are
# expected to be located in version and robot specific configuration
# directories.

[defaultconfig]
file_rev = 1   # list.toml file revision

# ---- STANDARD INCLUDES
# These are the standard includes, expected in config/default

%include logserver.toml       # LogServer configuration
%include supervisor.toml      # Top-level supervisor module
%include stateestimator.toml  # Leg kinematics + IMU EKF
%include stand.toml

# ---- VERSION-SPECIFIC INCLUDES
# The following files should be present in a version specific directory within
# config/versions.

# Required include defining the hardware type and hardware specific modules.
# Thread configuration (threads.toml) is included from versionlist.toml by
# the versions that have one, so nothing in default/ can shadow it.
%include hardware.toml

# -- These are for fine-tuning of behavior based on robot structure
%include drawsquare.toml
%include trot.toml
%include legcontrol.toml
%include sit.toml

# ---- ROBOT-SPECIFIC INCLUDES
# The following files should be present in a robot specific directory
# within config/robots. 

# -- All robot specific calibration settings should be in this file,
%include calibration_params.toml

