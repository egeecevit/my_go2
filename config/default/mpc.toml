# --- mpc.toml ---
# MdlConvexMPC configuration; missing or malformed model and solver settings are initialization errors.

[mpc]

# ---- HORIZON
# Horizon discretization interval [s]; contact scheduling is sampled on this grid and lookahead equals horizon * dt.
dt = 0.01                 # [s]

# Prediction steps; lookahead equals horizon * dt and the count is bounded by MdlConvexMPC::MAX_HORIZON.
horizon = 15
# QP solve interval [s], independent of dt; contact-mask changes may trigger an immediate re-solve.
solve_period = 0.01        # [s]

# ---- RIGID BODY
# Aggregate rigid-body mass properties at the nominal standing configuration; the convex model treats leg mass as part of this body.

mass = 15.2064            # [kg]

# Whole-robot COM offset [m] from the body-frame origin; predicted moments and inertia use this point.
com_offset_body = [-0.00172, 0.0, -0.02227]   # [m]

# Body-axis inertia about the COM in row-major order [kg m^2].
inertia_body = [ 0.177718,  0.000122, -0.016809,
                 0.000122,  0.488065, -0.000031,
                -0.016809, -0.000031,  0.535074]   # [kg m^2]

gravity = 9.81            # [m/s^2], magnitude; the state carries -gravity

# ---- CONTACT
# Coulomb friction coefficient for the square-pyramid constraints |fx| <= mu*fz and |fy| <= mu*fz.
friction = 0.6

# Normal force bounds per stance foot [N]; force_min = 0 permits unloaded contact.
force_min = 0.0           # [N]
force_max = 200.0         # [N]

# ---- COST
# State-cost weights in order roll, pitch, yaw, x, y, z, wx, wy, wz, vx, vy, vz.
state_weights = [1, 1, 1, 0, 0, 50, 0, 0, 1, 1, 1, 1]

# Force penalty; keep positive so the condensed Hessian remains positive definite when a foot is airborne.
force_weight = 1.0e-6

# Multiplier on the final horizon state's cost weights.
terminal_weight_scale = 1.0

# Maximum qpOASES working-set recalculations allowed per solve before declaring failure.
max_working_set = 250

# ---- DIAGNOSTICS
# Optional binary dump of each successful problem and predicted state trajectory for offline diagnostics.
# dump_path = "/tmp/mpc_dump.bin"
