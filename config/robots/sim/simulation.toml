# simulation.toml - MuJoCo simulation configuration for sim robot
#
# This file contains configuration parameters for the MdlSimDriver module
# that controls the MuJoCo physics simulation environment.

[simulation]

# Path to the model file
model_path = "../models/unitree_go2/scene.xml"

# Initial robot body position [x, y, z] in world coordinates (m), default: [0.0, 0.0, 0.5]
initial_position = [0,0,0.5]

# Initial Roll (deg): rotation around X-axis (positive = right side down)
# Initial Pitch (deg): rotation around Y-axis (positive = nose down)  
# Initial Yaw (deg): rotation around Z-axis (positive = counterclockwise from above)
initial_roll = 30.0
initial_pitch = 30.0
initial_yaw = 30.0

# Gravity vector, default: [0.0, 0.0, -9.81]
gravity = [0.0, 0.0, -9.81]

# Rendering framerate (frames per second), default: 30.0 fps
framerate = 30

# Headless mode (no visualization window). Default: false (show visualization)
headless = false

# Real-time simulation. Slows down simulation if faster than realtime. Default: false
realtime = false
