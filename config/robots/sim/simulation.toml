# simulation.toml - MuJoCo simulation configuration for sim robot
#
# This file contains configuration parameters for the MdlSimDriver module
# that controls the MuJoCo physics simulation environment.

[simulation]

# Path to the model file
model_path = "../models/unitree_go2/scene.xml"

# Omit initial_position/orientation to use model's home keyframe (standing on ground)

# Gravity vector, default: [0.0, 0.0, -9.81]
gravity = [0.0, 0.0, -9.81]

# Rendering framerate (frames per second), default: 30.0 fps
framerate = 30

# Headless mode (no visualization window). Default: false (show visualization)
headless = false

# Real-time simulation. Slows down simulation if faster than realtime. Default: false
realtime = true

# Disturbance push on the trunk for balance tests: a world-frame force [N] held for
# push_duration [s], fired once at push_time [s] of simulation time (0 = never) and
# on every P key press in the simulation window. Default: no push.
push_force = [0.0, -5.0, 0.0]
push_duration = 0.1
push_time = 0.0
# Rise time [s] of the push: the force grows linearly from zero over push_ramp,
# then holds until the push ends (thesis Sec. 6.6.5.2 persistent force, 2 s).
# Default 0: the full force from the first tick.
push_ramp = 0.0
